<div class="container">
    <div class="search-section">
        <h2>Tìm kiếm địa điểm của bạn</h2>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Tìm club, nhà hàng...">

    <div class="categories">

        <div class="category-btn" onclick="filterCategory('club')">Club</div>
        <div class="category-btn" onclick="filterCategory('restaurant')">Nhà hàng</div>

    <div class="venues-grid" id="venuesGrid"></div>
</div>

<!-- Modal Đăng nhập -->

    <!-- Modal Đặt chỗ -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('bookingModal')">&times;</span>
            <h2 id="bookingTitle">Đặt chỗ</h2>
            <form onsubmit="submitBooking(event)">
                <div class="form-group">
                    <label>Họ tên *</label>
                    <input type="text" id="bookingName" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="bookingEmail" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại *</label>
                    <input type="tel" id="bookingPhone" required>
                </div>
                <div class="form-group">
                    <label>Ngày đặt *</label>
                    <input type="date" id="bookingDate" required>
                </div>
                <div class="form-group">
                    <label>Giờ đặt *</label>
                    <input type="time" id="bookingTime" required>
                </div>
                <div class="form-group">
                    <label>Số người</label>
                    <input type="number" id="bookingGuests" min="1" value="2" required>
                </div>
                <div class="form-group">
                    <label>Ghi chú</label>
                    <textarea id="bookingNote" rows="3" style="width: 100%; padding: 12px; border: 1px solid rgba(88, 101, 242, 0.3); border-radius: 10px; font-size: 14px; background: rgba(15, 23, 42, 0.5); color: #e2e8f0; font-family: inherit; resize: vertical;"></textarea>
                </div>
                <button type="submit" class="btn-submit">Xác nhận đặt chỗ</button>
            </form>
        </div>
    </div>


<script>
    // Dữ liệu mẫu
    const venues = [
        {
            id: 1, 
            name: 'The Lighthouse Club', 
            type: 'club', 
            city: 'hanoi', 
            address: 'Hoàn Kiếm, Hà Nội', 
            rating: 4.5, 
            price: '300.000đ - 1.000.000đ',
            image: 'https://images.unsplash.com/photo-1566417713940-fe7c737a9ef2?w=500'
        },
        {
            id: 2, 
            name: 'Sky Bar Rooftop', 
            type: 'club', 
            city: 'hcm', 
            address: 'Quận 1, TP.HCM', 
            rating: 4.8, 
            price: '500.000đ - 2.000.000đ',
            image: 'https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=500'
        },
        {
            id: 3, 
            name: 'Nhà hàng Hương Sen', 
            type: 'restaurant', 
            city: 'hanoi', 
            address: 'Ba Đình, Hà Nội', 
            rating: 4.3, 
            price: '200.000đ - 800.000đ',
            image: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500'
        },
        {
            id: 4, 
            name: 'Sushi Master', 
            type: 'restaurant', 
            city: 'hcm', 
            address: 'Quận 3, TP.HCM', 
            rating: 4.6, 
            price: '300.000đ - 1.500.000đ',
            image: 'https://images.unsplash.com/photo-1579027989536-b7b1f875659b?w=500'
        },
        {
            id: 5, 
            name: 'Diamond Club', 
            type: 'club', 
            city: 'danang', 
            address: 'Sơn Trà, Đà Nẵng', 
            rating: 4.7, 
            price: '400.000đ - 1.500.000đ',
            image: 'https://images.unsplash.com/photo-1571266028243-d220e4bbd2a3?w=500'
        },
        {
            id: 6, 
            name: 'Nhà hàng Biển Đông', 
            type: 'restaurant', 
            city: 'nhatrang', 
            address: 'Trần Phú, Nha Trang', 
            rating: 4.4, 
            price: '250.000đ - 1.000.000đ',
            image: 'https://images.unsplash.com/photo-1552566626-52f8b828add9?w=500'
        },
    ];

    let currentCategory = 'all';
    let users = JSON.parse(localStorage.getItem('users') || '[]');
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

    // Khởi tạo
    function init() {
        displayVenues(venues);
        checkLogin();
    }

    function checkLogin() {
        if (currentUser) {
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').textContent = `Xin chào, ${currentUser.name}`;
        }
    }

    function displayVenues(venuesToShow) {
        const grid = document.getElementById('venuesGrid');
        grid.innerHTML = venuesToShow.map(venue => `
            <div class="venue-card">
                <div class="venue-image" style="background-image: url('${venue.image}')">
                    <span>${venue.type === 'club' ? '🎵' : '🍽️'}</span>
                </div>
                <div class="venue-info">
                    <h3>${venue.name}</h3>
                    <p>📍 ${venue.address}</p>
                    <p>💰 ${venue.price}</p>
                    <div class="venue-rating">⭐ ${venue.rating}/5</div>
                    <button class="btn-book" onclick="bookVenue(${venue.id})">Đặt chỗ ngay</button>
                </div>
            </div>
        `).join('');
    }

    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        const filtered = category === 'all' ? venues : venues.filter(v => v.type === category);
        displayVenues(filtered);
    }

    function searchVenues() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const city = document.getElementById('citySelect').value;
        
        let filtered = venues;
        
        if (currentCategory !== 'all') {
            filtered = filtered.filter(v => v.type === currentCategory);
        }
        
        if (searchText) {
            filtered = filtered.filter(v => v.name.toLowerCase().includes(searchText));
        }
        
        if (city) {
            filtered = filtered.filter(v => v.city === city);
        }
        
        displayVenues(filtered);
    }

    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'block';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    function register(e) {
        e.preventDefault();
        const name = document.getElementById('registerName').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;
        const phone = document.getElementById('registerPhone').value;
        
        if (users.find(u => u.email === email)) {
            alert('Email đã tồn tại!');
            return;
        }
        
        const newUser = {id: Date.now(), name, email, password, phone};
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        
        alert('Đăng ký thành công!');
        closeModal('registerModal');
        openModal('loginModal');
    }

    function login(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert('Đăng nhập thành công!');
            closeModal('loginModal');
            checkLogin();
        } else {
            alert('Email hoặc mật khẩu không đúng!');
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        document.getElementById('authButtons').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
        alert('Đã đăng xuất!');
    }

            let selectedVenue = null;

        function bookVenue(venueId) {
            if (!currentUser) {
                alert('Vui lòng đăng nhập để đặt chỗ!');
                openModal('loginModal');
                return;
            }
            
            selectedVenue = venues.find(v => v.id === venueId);
            document.getElementById('bookingTitle').textContent = `Đặt chỗ tại ${selectedVenue.name}`;
            
            // Auto-fill user info
            if (currentUser) {
                document.getElementById('bookingName').value = currentUser.name || '';
                document.getElementById('bookingEmail').value = currentUser.email || '';
                document.getElementById('bookingPhone').value = currentUser.phone || '';
            }
            
            openModal('bookingModal');
        }

        function submitBooking(e) {
            e.preventDefault();
            
            const bookingData = {
                venue: selectedVenue.name,
                venueAddress: selectedVenue.address,
                name: document.getElementById('bookingName').value,
                email: document.getElementById('bookingEmail').value,
                phone: document.getElementById('bookingPhone').value,
                date: document.getElementById('bookingDate').value,
                time: document.getElementById('bookingTime').value,
                guests: document.getElementById('bookingGuests').value,
                note: document.getElementById('bookingNote').value
            };
            
            // Send to EmailJS or your backend
            sendBookingEmail(bookingData);
        }

        function sendBookingEmail(data) {
            // Create mailto link (works on mobile)
            const subject = `[BookingVN] Đặt chỗ tại ${data.venue}`;
            const body = `
Thông tin đặt chỗ:

Địa điểm: ${data.venue}
Địa chỉ: ${data.venueAddress}

Khách hàng: ${data.name}
Email: ${data.email}
SĐT: ${data.phone}

Ngày: ${data.date}
Giờ: ${data.time}
Số người: ${data.guests}

Ghi chú: ${data.note || 'Không có'}
            `.trim();
            
            const mailtoLink = `mailto:nghjakzz133@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            
            window.location.href = mailtoLink;
            
            closeModal('bookingModal');
            alert('Đang mở ứng dụng email của bạn...');
            
            // Reset form
            document.querySelector('#bookingModal form').reset();
        }


    // Đóng modal khi click bên ngoài
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    init();
</script>
