    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        animation: gradientShift 15s ease infinite;
        background-size: 200% 200%;
    }
    
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    
    header {
        background: rgba(255, 255, 255, 0.98);
        padding: 15px 0;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
        animation: slideDown 0.5s ease;
    }
    
    @keyframes slideDown {
        from {
            transform: translateY(-100%);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }
    
    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
    }
    
    .nav-links button {
        margin-left: 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
    }
    
    .btn-login {
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
    }
    
    .btn-register {
        background: #667eea;
        color: white;
    }
    
    .btn-login:hover {
        background: #667eea;
        color: white;
    }
    
    .btn-register:hover {
        background: #764ba2;
    }
    
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 1000;
    }
    
    .modal-content {
        background: white;
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        border-radius: 10px;
        position: relative;
    }
    
    .close {

        top: 15px;
        font-size: 28px;
        cursor: pointer;
        color: #999;
    }
    
    .close:hover {
        color: #333;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .btn-submit {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .btn-submit:hover {
        background: #764ba2;
    }
    
    .search-section {
        background: white;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .search-section h2 {
        color: #333;
        margin-bottom: 20px;
    }
    
    .search-bar {
        display: flex;
        gap: 10px;
    }
    
    .search-bar input, .search-bar select {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
    }
    
    .search-bar button {
        padding: 12px 30px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
    }
    
    .search-bar button:hover {
        background: #764ba2;
    }
    
    .categories {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;

    .category-btn {
        flex: 1;
        padding: 15px;
        background: white;
        border: 2px solid #667eea;

    .venues-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;

        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: transform 0.3s;
    }
    
    .venue-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 25px rgba(0,0,0,0.15);
    }
    
    .venue-image {
        width: 100%;
        height: 200px;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 48px;
        position: relative;
        overflow: hidden;
    }
    
    .venue-image::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(102,126,234,0.7) 0%, rgba(118,75,162,0.7) 100%);
        transition: opacity 0.3s;
    }
    
    .venue-card:hover .venue-image::before {
        opacity: 0.5;
    }
    
    .venue-image span {
        position: relative;
        z-index: 1;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }
    
    .venue-info {
        padding: 20px;
    }
    
    .venue-info h3 {
        color: #333;
        margin-bottom: 10px;
    }
    
    .venue-info p {
        color: #666;
        font-size: 14px;
        margin-bottom: 5px;
    }
    
    .venue-rating {
        color: #ffa500;
        font-size: 14px;
        margin: 10px 0;
    }
    
    .btn-book {
        width: 100%;
        padding: 10px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }
    
    .btn-book:hover {
        background: #764ba2;
    }
    
    .user-info {
        display: none;
        color: white;
        align-items: center;
        gap: 15px;
    }
    
    .user-info span {
        font-weight: 500;
    }
    
    .btn-logout {
        padding: 8px 15px;
        background: rgba(255,255,255,0.2);
        color: white;
        border: 1px solid white;
        border-radius: 5px;
        cursor: pointer;
    }
    
    .btn-logout:hover {
        background: rgba(255,255,255,0.3);
    }

```
<div class="container">
    <div class="search-section">
        <h2>Tìm kiếm địa điểm của bạn</h2>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Tìm club, nhà hàng...">
            <select id="citySelect">
                <option value="">Chọn thành phố</option>
                <option value="hanoi">Hà Nội</option>
                <option value="hcm">TP. Hồ Chí Minh</option>
                <option value="danang">Đà Nẵng</option>
                <option value="nhatrang">Nha Trang</option>
            </select>
            <button onclick="searchVenues()">Tìm kiếm</button>
        </div>
    </div>

    <div class="categories">
        <div class="category-btn active" onclick="filterCategory('all')">Tất cả</div>
        <div class="category-btn" onclick="filterCategory('club')">Club</div>
        <div class="category-btn" onclick="filterCategory('restaurant')">Nhà hàng</div>
    </div>

    <div class="venues-grid" id="venuesGrid"></div>
</div>

<!-- Modal Đăng nhập -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('loginModal')">&times;</span>
        <h2>Đăng nhập</h2>
        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>
    </div>
</div>

<!-- Modal Đăng ký -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('registerModal')">&times;</span>
        <h2>Đăng ký tài khoản</h2>
        <form onsubmit="register(event)">
            <div class="form-group">
                <label>Họ tên</label>
                <input type="text" id="registerName" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="registerPassword" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="registerPhone" required>
            </div>
            <button type="submit" class="btn-submit">Đăng ký</button>
        </form>
    </div>
</div>

<script>
    // Dữ liệu mẫu
    const venues = [
        {
            id: 1, 
            name: 'The Lighthouse Club', 
            type: 'club', 
            city: 'hanoi', 
            address: 'Hoàn Kiếm, Hà Nội', 
            rating: 4.5, 
            price: '300.000đ - 1.000.000đ',
            image: 'https://images.unsplash.com/photo-1566417713940-fe7c737a9ef2?w=500'
        },
        {
            id: 2, 
            name: 'Sky Bar Rooftop', 
            type: 'club', 
            city: 'hcm', 
            address: 'Quận 1, TP.HCM', 
            rating: 4.8, 
            price: '500.000đ - 2.000.000đ',
            image: 'https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=500'
        },
        {
            id: 3, 
            name: 'Nhà hàng Hương Sen', 
            type: 'restaurant', 
            city: 'hanoi', 
            address: 'Ba Đình, Hà Nội', 
            rating: 4.3, 
            price: '200.000đ - 800.000đ',
            image: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500'
        },
        {
            id: 4, 
            name: 'Sushi Master', 
            type: 'restaurant', 
            city: 'hcm', 
            address: 'Quận 3, TP.HCM', 
            rating: 4.6, 
            price: '300.000đ - 1.500.000đ',
            image: 'https://images.unsplash.com/photo-1579027989536-b7b1f875659b?w=500'
        },
        {
            id: 5, 
            name: 'Diamond Club', 
            type: 'club', 
            city: 'danang', 
            address: 'Sơn Trà, Đà Nẵng', 
            rating: 4.7, 
            price: '400.000đ - 1.500.000đ',
            image: 'https://images.unsplash.com/photo-1571266028243-d220e4bbd2a3?w=500'
        },
        {
            id: 6, 
            name: 'Nhà hàng Biển Đông', 
            type: 'restaurant', 
            city: 'nhatrang', 
            address: 'Trần Phú, Nha Trang', 
            rating: 4.4, 
            price: '250.000đ - 1.000.000đ',
            image: 'https://images.unsplash.com/photo-1552566626-52f8b828add9?w=500'
        },
    ];

    let currentCategory = 'all';
    let users = JSON.parse(localStorage.getItem('users') || '[]');
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

    // Khởi tạo
    function init() {
        displayVenues(venues);
        checkLogin();
    }

    function checkLogin() {
        if (currentUser) {
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').textContent = `Xin chào, ${currentUser.name}`;
        }
    }

    function displayVenues(venuesToShow) {
        const grid = document.getElementById('venuesGrid');
        grid.innerHTML = venuesToShow.map(venue => `
            <div class="venue-card">
                <div class="venue-image" style="background-image: url('${venue.image}')">
                    <span>${venue.type === 'club' ? '🎵' : '🍽️'}</span>
                </div>
                <div class="venue-info">
                    <h3>${venue.name}</h3>
                    <p>📍 ${venue.address}</p>
                    <p>💰 ${venue.price}</p>
                    <div class="venue-rating">⭐ ${venue.rating}/5</div>
                    <button class="btn-book" onclick="bookVenue(${venue.id})">Đặt chỗ ngay</button>
                </div>
            </div>
        `).join('');
    }

    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        const filtered = category === 'all' ? venues : venues.filter(v => v.type === category);
        displayVenues(filtered);
    }

    function searchVenues() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const city = document.getElementById('citySelect').value;
        
        let filtered = venues;
        
        if (currentCategory !== 'all') {
            filtered = filtered.filter(v => v.type === currentCategory);
        }
        
        if (searchText) {
            filtered = filtered.filter(v => v.name.toLowerCase().includes(searchText));
        }
        
        if (city) {
            filtered = filtered.filter(v => v.city === city);
        }
        
        displayVenues(filtered);
    }

    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'block';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    function register(e) {
        e.preventDefault();
        const name = document.getElementById('registerName').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;
        const phone = document.getElementById('registerPhone').value;
        
        if (users.find(u => u.email === email)) {
            alert('Email đã tồn tại!');
            return;
        }
        
        const newUser = {id: Date.now(), name, email, password, phone};
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        
        alert('Đăng ký thành công!');
        closeModal('registerModal');
        openModal('loginModal');
    }

    function login(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert('Đăng nhập thành công!');
            closeModal('loginModal');
            checkLogin();
        } else {
            alert('Email hoặc mật khẩu không đúng!');
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        document.getElementById('authButtons').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
        alert('Đã đăng xuất!');
    }

    function bookVenue(venueId) {
        if (!currentUser) {
            alert('Vui lòng đăng nhập để đặt chỗ!');
            openModal('loginModal');
            return;
        }
        
        const venue = venues.find(v => v.id === venueId);
        alert(`Đặt chỗ thành công tại ${venue.name}!\nChúng tôi sẽ liên hệ với bạn qua email: ${currentUser.email}`);
    }

    // Đóng modal khi click bên ngoài
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    init();
</script>
